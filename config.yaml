---
name: Edenic Local Broker
version: 0.4.0
slug: edenic_broker
description: >-
  Runs a tiny MQTT broker that Bluelab Guardian Wi-Fi meters can connect to
  after a DNS rewrite, and exposes their pH / EC / temperature in Home
  Assistant. No Edenic cloud account required.
url: https://github.com/YOURNAME/hassio-edenic-broker
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
services:
  - mqtt:provide
ports:
  1883/tcp: 1883
ports_description:
  1883/tcp: >-
    Port the Guardian connects to. Must be 1883 - the device hard-codes it.
options:
  discovery_prefix: homeassistant
  log_level: info
  allow_writes: false
schema:
  discovery_prefix: str
  log_level: list(debug|info|warning|error)
  allow_writes: bool
